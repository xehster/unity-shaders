name: Sync gallery GIF

on:
  schedule:
    # Same schedule as Shader Gallery's shader sync: 06:00 UTC / 10:00 Tbilisi.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gallery-gif
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_URL: https://raw.githubusercontent.com/xehster/shader-gallery/main/docs/gallery.gif
      TARGET_PATH: docs/gallery.gif
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      GH_API_URL: ${{ github.api_url }}
    steps:
      - name: Copy the GIF only if its contents changed
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          def request(url, *, method="GET", payload=None, authenticated=True):
              headers = {"User-Agent": "gallery-gif-sync"}
              if authenticated:
                  headers.update({
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          gif = request(os.environ["SOURCE_URL"], authenticated=False)
          if gif[:6] not in (b"GIF87a", b"GIF89a"):
              raise RuntimeError("The source is not a GIF; the existing file was left alone.")

          # GitHub's file SHA is a Git blob hash, not the SHA of the raw bytes.
          blob = b"blob " + str(len(gif)).encode("ascii") + b"\0" + gif
          source_sha = hashlib.sha1(blob).hexdigest()
          branch = os.environ["TARGET_BRANCH"]
          path = urllib.parse.quote(os.environ["TARGET_PATH"], safe="/")
          endpoint = (os.environ["GH_API_URL"] + "/repos/"
                      + os.environ["GH_REPOSITORY"] + "/contents/" + path)
          lookup = endpoint + "?" + urllib.parse.urlencode({"ref": branch})

          for attempt in range(3):
              try:
                  current = json.loads(request(lookup))
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  current = {}

              if current.get("sha") == source_sha:
                  print("The GIF is unchanged; no commit needed.")
                  break

              update = {
                  "message": "Update gallery GIF from shader-gallery",
                  "content": base64.b64encode(gif).decode("ascii"),
                  "branch": branch,
              }
              if current.get("sha"):
                  update["sha"] = current["sha"]
              try:
                  result = json.loads(request(endpoint, method="PUT", payload=update))
                  print("Updated gallery GIF: " + result["commit"]["html_url"])
                  break
              except urllib.error.HTTPError as error:
                  # Another update may have landed between reading the file and saving it.
                  if error.code not in (409, 422) or attempt == 2:
                      raise
                  time.sleep(3)
